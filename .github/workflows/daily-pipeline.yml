name: Daily Card Pipeline

on:
  schedule:
    - cron: '0 13 * * *'   # 9am ET every day
  workflow_dispatch:
    inputs:
      set_index:
        description: 'Set index to run (0 = Chaos Rising, leave blank to auto-rotate by day)'
        required: false
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so price diffs can read old data.json files

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome headless dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm1 \
            libasound2t64 libxrandr2 libxkbcommon0 \
            libxfixes3 libxcomposite1 libxdamage1

      - name: Run pipeline
        run: |
          ARGS="-g pokemon -c config/pokemon.json"
          if [ -n "${{ inputs.set_index }}" ]; then
            ARGS="$ARGS --set-index ${{ inputs.set_index }}"
          fi
          npx tsx src/pipeline.ts $ARGS
        env:
          POKEMON_TCG_API_KEY: ${{ secrets.POKEMON_TCG_API_KEY }}

      - name: Commit data snapshot
        run: |
          git config user.name "cardIndx-bot"
          git config user.email "bot@cardindx.local"
          git add output/*/*_data.json
          git diff --cached --quiet || git commit -m "data: $(date +%Y-%m-%d) price snapshot"
          git push

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: output/*/*_video.mp4
          retention-days: 14
