name: Daily Card Pipeline

on:
  schedule:
    - cron: '0 13 * * *'   # 9am ET every day
  workflow_dispatch:
    inputs:
      set_id:
        description: 'Set ID to run (e.g. me2pt5) — leave blank to auto-rotate by day'
        required: false
        type: string
      date:
        description: 'Video date label (YYYY-MM-DD) — leave blank for today'
        required: false
        type: string
      title:
        description: 'Video title shown in Mosaic — leave blank for set name'
        required: false
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome headless dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm1 \
            libasound2t64 libxrandr2 libxkbcommon0 \
            libxfixes3 libxcomposite1 libxdamage1

      - name: Run pipeline
        run: |
          ARGS="-g pokemon -c config/pokemon.json"
          if [ -n "${{ inputs.set_id }}" ]; then
            ARGS="$ARGS --set-id ${{ inputs.set_id }}"
          fi
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ inputs.date }}"
          fi
          if [ -n "${{ inputs.title }}" ]; then
            ARGS="$ARGS --title \"${{ inputs.title }}\""
          fi
          npx tsx src/pipeline.ts $ARGS
        env:
          POKEMON_TCG_API_KEY: ${{ secrets.POKEMON_TCG_API_KEY }}
          JUSTTCG_API_KEY: ${{ secrets.JUSTTCG_API_KEY }}

      - name: Commit data snapshot
        run: |
          git config user.name "cardIndx-bot"
          git config user.email "bot@cardindx.local"
          git add data/prices/ data/catalogs/
          git diff --cached --quiet || git commit -m "data: $(date +%Y-%m-%d) price snapshot"
          git push

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: output/*/*_video.mp4
          retention-days: 14
